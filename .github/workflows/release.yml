name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build binaries
        run: |
          mkdir -p dist
          # macOS
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/agys-darwin-arm64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/agys-darwin-amd64 .
          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/agys-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/agys-linux-arm64 .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agys-darwin-arm64
            dist/agys-darwin-amd64
            dist/agys-linux-amd64
            dist/agys-linux-arm64
          generate_release_notes: true
